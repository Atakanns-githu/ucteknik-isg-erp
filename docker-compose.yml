x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ucteknik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanımlayın}
      POSTGRES_DB: ${POSTGRES_DB:-ucteknik_isg}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    profiles: [app]
    build:
      context: .
      target: runner
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    logging: *default-logging
    env_file: .env
    environment:
      AUTOMATION_RUNNER_MODE: disabled
      STORAGE_DIR: /app/storage
      TRUSTED_CA_PEM_PATH: /app/certs
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - app_storage:/app/storage
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: [worker]
    build:
      context: .
      target: tools
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging: *default-logging
    env_file: .env
    environment:
      AUTOMATION_RUNNER_MODE: worker
      STORAGE_DIR: /app/storage
      TRUSTED_CA_PEM_PATH: /app/certs
    volumes:
      - app_storage:/app/storage
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs'); if (process.env.AUTOMATION_RUNNER_MODE !== 'worker') process.exit(1); fs.accessSync(process.env.STORAGE_DIR || '/app/storage', fs.constants.R_OK | fs.constants.W_OK);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  app_storage:
